name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The runner image already has the Python tool cache; do not download a standalone build.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.8.22
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # GitHub's release-download endpoint occasionally returns 504 while the asset API is
      # healthy. Seed the same binary the Makefile caches, then let its SHA-256 check run.
      - name: Seed the Tailwind CLI
        run: |
          mkdir -p .cache
          binary=.cache/tailwindcss-v3.4.17-linux-x64
          if [ ! -x "$binary" ]; then
            asset_id=$(curl --fail --silent --show-error \
              "https://api.github.com/repos/tailwindlabs/tailwindcss/releases/tags/v3.4.17" \
              | jq -r '.assets[] | select(.name == "tailwindcss-linux-x64") | .id')
            curl --fail --location --silent --show-error \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/tailwindlabs/tailwindcss/releases/assets/$asset_id" \
              -o "$binary"
            chmod +x "$binary"
          fi
          test -x "$binary"

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck

      - name: Check shell scripts
        run: shellcheck scripts/smoke_container.sh deploy/install-debian.sh deploy/build-release.sh

      # No `make i18n-compile` first: the wheel's build hook (hatch_build.py) must compile the
      # gitignored .mo catalogs itself, and verify_wheel.py fails if they are missing.
      - name: Build and inspect non-editable wheel
        run: |
          uv run --locked make css
          uv build --wheel --out-dir dist
          python -m zipfile -l dist/assetboard-*.whl
          uv run --locked python scripts/verify_wheel.py dist/assetboard-*.whl
          uv venv --python 3.13 /tmp/assetboard-wheel-check
          uv pip install --python /tmp/assetboard-wheel-check/bin/python --no-deps dist/assetboard-*.whl
          PYTHONPATH= /tmp/assetboard-wheel-check/bin/python scripts/verify_installed_wheel.py

      - name: Install Playwright browser
        run: uv run --locked playwright install --with-deps chromium

      - name: Run project checks
        run: uv run --locked make check

      - name: Run Playwright browser tests (shell smoke and OIDC sign-in)
        run: |
          uv run --locked make i18n-compile
          ASSETBOARD_RUN_BROWSER_TESTS=1 uv run --locked pytest tests/browser

      # Compiled .mo catalogs are build output (gitignored), so only app.css is checked here.
      - name: Verify generated assets are fresh
        run: |
          uv run --locked make css
          git diff --exit-code -- src/assetboard/static/css/app.css

      - name: Verify translation catalogs are fresh
        run: |
          uv run --locked make i18n-update
          git diff --exit-code -- src/assetboard/locales/en/LC_MESSAGES/messages.po src/assetboard/locales/pl/LC_MESSAGES/messages.po
