name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.22
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build and inspect non-editable wheel
        run: |
          uv run --locked make css i18n-compile
          uv build --wheel --out-dir dist
          python -m zipfile -l dist/assetboard-*.whl
          uv run --locked python scripts/verify_wheel.py dist/assetboard-*.whl
          uv venv --python 3.13 /tmp/assetboard-wheel-check
          uv pip install --python /tmp/assetboard-wheel-check/bin/python --no-deps dist/assetboard-*.whl
          PYTHONPATH= /tmp/assetboard-wheel-check/bin/python scripts/verify_installed_wheel.py

      - name: Install Playwright browser
        run: uv run --locked playwright install --with-deps chromium

      - name: Run project checks
        run: uv run --locked make check

      - name: Run Playwright shell smoke
        run: ASSETBOARD_RUN_BROWSER_TESTS=1 uv run --locked pytest tests/browser/test_f04_smoke.py

      - name: Verify generated assets are fresh
        run: |
          uv run --locked make css i18n-compile
          git diff --exit-code -- src/assetboard/static/css/app.css src/assetboard/locales/en/LC_MESSAGES/messages.mo src/assetboard/locales/pl/LC_MESSAGES/messages.mo

      - name: Verify translation catalogs are fresh
        run: |
          uv run --locked make i18n-update
          git diff --exit-code -- src/assetboard/locales/en/LC_MESSAGES/messages.po src/assetboard/locales/pl/LC_MESSAGES/messages.po
