name: Docker

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_call'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_call' }}
            type=raw,value=pr-{{number}},enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}

      - name: Build image and publish release tags
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ (github.event_name == 'push' || github.event_name == 'workflow_call') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container health
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          container=assetboard-ci-smoke
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" --publish 127.0.0.1:8000:8000 \
            ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          healthy=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              healthy=true
              break
            fi
            sleep 2
          done
          docker logs "$container"
          if [ "$healthy" != true ]; then
            exit 1
          fi
