name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # A weekly run catches advisories published after the last commit.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.8.22
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Export the locked runtime requirements
        run: |
          uv export --frozen --no-default-groups --no-emit-project \
            --format requirements-txt --no-hashes > runtime-requirements.txt

      # Rollout is report-first: the full audit is visible but does not fail the build, so a
      # newly published advisory cannot block an unrelated fix. The next step is the gate.
      - name: pip-audit report (all severities, non-blocking)
        continue-on-error: true
        run: |
          uvx --from pip-audit==2.10.1 pip-audit --requirement runtime-requirements.txt \
            --format json --output pip-audit.json

      # Severity comes from the OSV record; a missing/unreadable severity is fail-closed.
      - name: Reject high or critical Python vulnerabilities (blocking)
        run: uv run --no-project python scripts/check_pip_audit.py pip-audit.json

      - name: Verify the generated third-party notices are fresh
        run: uv run --locked python scripts/generate_third_party_licenses.py --check

  image:
    # A weekly build catches a base-image advisory even when no code changed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the current image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: assetboard:security-scan
          build-args: |
            VERSION=${{ github.ref_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=smoke-amd64

      - name: Reject fixed high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: assetboard:security-scan
          scan-type: image
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
