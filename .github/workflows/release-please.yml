name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    permissions:
      contents: read
      packages: write

  # Files for the native install (docs/install/native.md): the wheel, its locked requirements
  # with hashes, the systemd unit, the env example, the install script and SHA256SUMS.
  release-assets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.8.22

      - name: Set up Python
        run: uv python install 3.13

      - name: Build the release files
        run: deploy/build-release.sh dist/release

      # --root: no system user, no systemd; checks that the files install and migrate a database.
      - name: Install them into a scratch root
        run: |
          deploy/install-debian.sh --root "$RUNNER_TEMP/root" --version "${TAG#v}" \
            --release-url "file://$PWD/dist/release" --python "$(uv python find 3.13)"

      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/release/* --clobber
