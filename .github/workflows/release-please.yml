name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    permissions:
      contents: read
      packages: write

  # Files for the native install (docs/install/native.md): the wheel, its locked requirements
  # with hashes, the systemd unit, the env example, the install script and SHA256SUMS.
  release-assets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.8.22

      - name: Set up Python
        run: uv python install 3.13

      - name: Build the release files
        run: deploy/build-release.sh dist/release

      # --root: no system user, no systemd; checks that the files install and migrate a database.
      - name: Install them into a scratch root
        run: |
          deploy/install-debian.sh --root "$RUNNER_TEMP/root" --version "${TAG#v}" \
            --release-url "file://$PWD/dist/release" --python "$(uv python find 3.13)"

      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/release/* --clobber

      # The release is not complete until every generated file, including the SBOM and the
      # wheel, is attached to this tag's release. The upload step is brand-neutral; this one
      # also fails if a new build output is ever not attached.
      - name: Verify the attached release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t built < <(find dist/release -maxdepth 1 -type f ! -name .gitignore \
            -printf '%f\n' | sort)
          built_list=$RUNNER_TEMP/release-files.txt
          printf '%s\n' "${built[@]}" > "$built_list"
          uploaded=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for file in "${built[@]}"; do
            if ! grep -qxF "$file" <<< "$uploaded"; then
              echo "Release $TAG is missing the attached file: $file" >&2
              exit 1
            fi
          done
          grep -q -- '-sbom.cdx.json$' "$built_list" || {
            echo "No CycloneDX SBOM was built for $TAG" >&2
            exit 1
          }
          grep -qxF 'SHA256SUMS' "$built_list" || {
            echo "No SHA256SUMS was built for $TAG" >&2
            exit 1
          }
          (cd dist/release && sha256sum --check --strict SHA256SUMS >/dev/null)
          # Every built file must be checksummed, and every checksum must name a built file.
          comm -3 \
            <(find dist/release -maxdepth 1 -type f ! -name SHA256SUMS ! -name .gitignore \
              -printf '%f\n' | sort) \
            <(awk '{print $2}' dist/release/SHA256SUMS | sed 's/^\*//' | sort) \
            | tee "$RUNNER_TEMP/checksum-mismatch.txt"
          if [[ -s $RUNNER_TEMP/checksum-mismatch.txt ]]; then
            echo "SHA256SUMS does not list exactly the built release files for $TAG" >&2
            exit 1
          fi
          python3 -c 'import json,glob; [json.load(open(p, encoding="utf-8")) for p in glob.glob("dist/release/*-sbom.cdx.json")]'
          echo "All $((${#built[@]})) release files are attached to $TAG."
