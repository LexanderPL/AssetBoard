repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: forbid-new-submodules
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: file-contents-sorter
        args: [--unique]
      - id: check-json
      - id: mixed-line-ending
      - id: requirements-txt-fixer

  - repo: local
    hooks:
      - id: block-database-and-spreadsheet-files
        name: Block .db and .xlsx files
        entry: bash -c 'git diff --cached --name-only --diff-filter=ACMR | grep -E "\.(db|xlsx)$" && { echo "Database or spreadsheet files are not allowed."; exit 1; } || true'
        language: system
        pass_filenames: false
