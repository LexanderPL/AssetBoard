{% extends "base.html" if web_session else "auth_base.html" %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<section class="panel mx-auto max-w-2xl p-7 sm:p-10" role="alert">
  <p class="text-sm font-semibold text-primary-ink">{{ status_code }}</p>
  <p class="mt-3 text-muted">{{ message }}</p>
  <a class="btn-primary mt-6" href="{{ scoped_url(request, 'home') }}">{{ _("Return to overview") }}</a>
</section>
{% endblock %}
