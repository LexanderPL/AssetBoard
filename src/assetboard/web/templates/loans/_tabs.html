{% macro tabs(active) -%}
{# Page tabs are navigation, not an ARIA tab widget: plain links, one row, aria-current. #}
<nav class="tab-strip" aria-label="{{ _('Loans') }}" data-tab-strip>
  <a href="{{ scoped_url(request, 'loans') }}" data-loans-tab{% if active == "loans" %} aria-current="page"{% endif %}>{{ _("Loans") }}</a>
  <a href="{{ scoped_url(request, 'reference_rates') }}" data-reference-rates-tab{% if active == "reference-rates" %} aria-current="page"{% endif %}>{{ _("Reference rates") }}</a>
</nav>
{%- endmacro %}
