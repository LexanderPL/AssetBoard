{% from "macros/components.html" import csrf_input with context %}
{% if not tax_warning_dismissed %}
<form method="post" action="{{ scoped_url(request, 'tax_warning_dismiss') }}" class="mb-5 flex items-start justify-between gap-4 rounded-xl border border-warning-line bg-warning-soft px-4 py-3 text-sm text-warning-strong" data-tax-warning>
  {{ csrf_input() }}
  <input type="hidden" name="return_to" value="{{ tax_warning_return }}">
  {% if tax_warning_return == "calculator" %}
  <input type="hidden" name="net" value="{{ values.net }}">
  <input type="hidden" name="day" value="{{ values.day }}">
  <input type="hidden" name="record_as" value="{{ values.record_as }}">
  {% endif %}
  <p>{{ _("Rates are entered by you; this is not tax advice.") }}</p>
  <button type="submit" class="rounded-lg px-2 py-1 text-lg leading-none hover:bg-warning-line" aria-label="{{ _('Dismiss warning') }}" title="{{ _('Dismiss warning') }}"><span aria-hidden="true">×</span></button>
</form>
{% endif %}
