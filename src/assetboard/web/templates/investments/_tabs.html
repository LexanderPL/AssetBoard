{% macro tabs(active) -%}
<div class="flex flex-wrap items-center gap-2" role="tablist" aria-label="{{ _('Investments') }}">
  {% if active == "instruments" %}
  <a href="{{ scoped_url(request, 'investments_instruments') }}" role="tab" aria-selected="true" data-instruments-tab class="rounded-xl bg-primary-soft px-4 py-2 text-sm font-semibold text-primary-ink">{{ _("Instruments") }}</a>
  {% else %}
  <a href="{{ scoped_url(request, 'investments_instruments') }}" role="tab" aria-selected="false" data-instruments-tab class="rounded-xl px-4 py-2 text-sm font-semibold text-muted hover:bg-subtle hover:text-ink">{{ _("Instruments") }}</a>
  {% endif %}
  {% if active == "classes" %}
  <a href="{{ scoped_url(request, 'investments_classes') }}" role="tab" aria-selected="true" data-classes-tab class="rounded-xl bg-primary-soft px-4 py-2 text-sm font-semibold text-primary-ink">{{ _("Asset classes") }}</a>
  {% else %}
  <a href="{{ scoped_url(request, 'investments_classes') }}" role="tab" aria-selected="false" data-classes-tab class="rounded-xl px-4 py-2 text-sm font-semibold text-muted hover:bg-subtle hover:text-ink">{{ _("Asset classes") }}</a>
  {% endif %}
</div>
{%- endmacro %}
