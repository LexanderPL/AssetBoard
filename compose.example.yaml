services:
  assetboard:
    image: ${ASSETBOARD_IMAGE:-assetboard:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bind to loopback when a local reverse proxy publishes the public endpoint.
      - "${ASSETBOARD_BIND_ADDRESS:-127.0.0.1}:${ASSETBOARD_HOST_PORT:-8000}:8000"
    environment:
      ASSETBOARD_ENV: prod
      ASSETBOARD_DATA_DIR: /data
      ASSETBOARD_BASE_URL: ${ASSETBOARD_BASE_URL:-http://localhost:8000}
      ASSETBOARD_DEFAULT_LOCALE: ${ASSETBOARD_DEFAULT_LOCALE:-en}
      ASSETBOARD_DEFAULT_CURRENCY: ${ASSETBOARD_DEFAULT_CURRENCY:-EUR}
      ASSETBOARD_LOG_FORMAT: ${ASSETBOARD_LOG_FORMAT:-json}
      # Your reverse proxy's IP or CIDR. Empty trusts no proxy; see docs/deployment.md.
      ASSETBOARD_TRUSTED_PROXIES: ${ASSETBOARD_TRUSTED_PROXIES:-}
      ASSETBOARD_AUTO_MIGRATE: "true"
      # Optional public demo mode. Anyone who can reach the instance can sign in to a shared
      # workspace without a password, so never enable it on an instance with real data.
      #ASSETBOARD_DEMO_ENABLED: "true"
      #ASSETBOARD_DEMO_RESET_TIME: "03:00"
      #ASSETBOARD_DEMO_TIMEZONE: "UTC"
      #ASSETBOARD_DEMO_IP_LIMIT: "20"
    volumes:
      - assetboard-data:/data
    # Container hardening (ADR-0009). Keep all four settings; the smoke test and the image
    # scan exercise them. Do not add `privileged: true`, host networking or the Docker socket.
    user: "10001:10001"          # the image's own unprivileged user, never root
    read_only: true              # the application files cannot be changed at runtime
    tmpfs:
      - /tmp:mode=1777           # the only other writable path, cleared on restart
    cap_drop:
      - ALL                      # no Linux capabilities are needed by the process
    security_opt:
      - no-new-privileges:true   # a compromised process cannot gain privileges
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Uncomment and configure for Traefik:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.assetboard.rule=Host(`finance.example.com`)
    #   - traefik.http.routers.assetboard.entrypoints=websecure
    #   - traefik.http.routers.assetboard.tls=true
    #   - traefik.http.services.assetboard.loadbalancer.server.port=8000
    # Or use Caddy with a host rule in your Caddyfile:
    # finance.example.com {
    #     reverse_proxy assetboard:8000
    # }

volumes:
  assetboard-data:
